<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vessel array viewer</title>
<style>
  :root {
    --bg: #12151a;
    --panel: #1b1f26;
    --line: #2c333d;
    --text: #d7dce3;
    --dim: #7f8a99;
    --vessel: #4bb3c9;
    --pericyte: #d9a441;
    --junction: #8f7fd4;
    --inlet: #59c26a;
    --sel: #ffffff;
    --up: #e08a3c;
    --down: #d354a8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap { display: flex; height: 100%; }
  #stage { flex: 1; position: relative; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.dragging { cursor: grabbing; }

  #side {
    width: 320px; background: var(--panel); border-left: 1px solid var(--line);
    padding: 14px; overflow-y: auto; flex-shrink: 0;
  }
  h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  h2 {
    font-size: 11px; margin: 18px 0 8px; color: var(--dim);
    text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
  }
  .drop {
    border: 1px dashed var(--line); border-radius: 6px; padding: 18px 12px;
    text-align: center; color: var(--dim); cursor: pointer;
  }
  .drop:hover, .drop.over { border-color: var(--vessel); color: var(--text); }
  input[type=file] { display: none; }
  input[type=search] {
    width: 100%; padding: 7px 9px; background: #0e1116; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; font: inherit;
  }
  button {
    background: #262c35; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 10px; font: inherit; cursor: pointer;
    margin: 0 4px 4px 0;
  }
  button:hover { background: #313945; }
  table.kv { width: 100%; border-collapse: collapse; }
  table.kv td { padding: 3px 0; vertical-align: top; }
  table.kv td:first-child { color: var(--dim); width: 88px; }
  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 9px;
    font-size: 11px; background: #262c35;
  }
  .swatch {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 6px; vertical-align: -1px;
  }
  .legend div { margin-bottom: 4px; color: var(--dim); }
  #tip {
    position: absolute; pointer-events: none; z-index: 10;
    background: #0c0f13ee; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; max-width: 300px; display: none;
    box-shadow: 0 6px 22px #0008;
  }
  #tip b { color: #fff; }
  #tip .row { color: var(--dim); }
  #tip .row span { color: var(--text); }
  #hint {
    position: absolute; left: 12px; bottom: 10px; color: var(--dim);
    font-size: 11px; pointer-events: none;
  }
  #count { color: var(--dim); font-size: 11px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <svg id="svg"></svg>
    <div id="tip"></div>
    <div id="hint">scroll to zoom · drag to pan · click an element to pin it</div>
  </div>

  <div id="side">
    <h1>Vessel array viewer</h1>

    <label class="drop" id="drop">
      drop a vessel array CSV here<br><span style="font-size:11px">or click to choose</span>
      <input type="file" id="file" accept=".csv,text/csv">
    </label>
    <div id="count" style="margin-top:8px"></div>

    <div id="controls" class="hidden">
      <h2>find</h2>
      <input type="search" id="search" placeholder="vessel name, e.g. V07">

      <h2>view</h2>
      <button id="fit">fit</button>
      <button id="clear">clear selection</button>
      <button id="toggleLabels">labels</button>

      <h2>selected</h2>
      <div id="detail" style="color:var(--dim)">nothing selected</div>

      <h2>legend</h2>
      <div class="legend">
        <div><span class="swatch" style="background:var(--inlet)"></span>inlet</div>
        <div><span class="swatch" style="background:var(--vessel)"></span>vessel</div>
        <div><span class="swatch" style="background:var(--pericyte)"></span>pericyte</div>
        <div><span class="swatch" style="background:var(--junction)"></span>VV junction</div>
        <div><span class="swatch" style="background:var(--up)"></span>feeds into it</div>
        <div><span class="swatch" style="background:var(--down)"></span>fed from it</div>
        <div><span class="swatch" style="background:#e0603c"></span>junction with bad ports</div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ---------- CSV ---------- */

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else quoted = false;
      } else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1)
    .filter(r => r.some(v => v.trim() !== ""))
    .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])));
}

/* ---------- model ---------- */

let nodes = [];            // one per array row
let byName = new Map();
let links = [];
let selected = null, hovered = null, showLabels = true;

function kindOf(r) {
  if ((r.BC_type || "").includes("junction")) return "junction";
  if ((r.vessel_type || "").includes("pericyte")) return "pericyte";
  if (/^inlet/i.test(r.name || "")) return "inlet";
  return "vessel";
}
const COLOUR = {
  junction: "var(--junction)", pericyte: "var(--pericyte)",
  inlet: "var(--inlet)", vessel: "var(--vessel)"
};

function build(rows) {
  nodes = rows.map((r, i) => ({
    i, name: r.name || `row${i}`, raw: r, kind: kindOf(r),
    gen: r.generation === "" || r.generation == null ? null : +r.generation,
    out: (r.out_vessels || "").split(/\s+/).filter(Boolean),
    inp: (r.inp_vessels || "").split(/\s+/).filter(Boolean),
    x: 0, y: 0
  }));
  byName = new Map(nodes.map(n => [n.name, n]));

  links = [];
  for (const n of nodes)
    for (const t of n.out) {
      const m = byName.get(t);
      if (m) links.push({ s: n, t: m });
    }

  /* Depth is measured on the graph itself rather than trusted from the
     generation column, because junction rows carry no generation and a
     single pass over them leaves any junction fed by another junction
     sitting at zero -- which drew them next to the inlet. */
  const incoming = new Map(nodes.map(n => [n, 0]));
  for (const l of links) incoming.set(l.t, incoming.get(l.t) + 1);

  const roots = nodes.filter(n => incoming.get(n) === 0);
  const seeds = roots.length ? roots
    : [nodes.find(n => /^inlet/i.test(n.name)) || nodes[0]];

  for (const n of nodes) n.depth = null;
  let frontier = seeds.slice();
  frontier.forEach(n => { n.depth = 0; });
  let d = 0;
  while (frontier.length && d < 5000) {
    d++;
    const next = [];
    for (const n of frontier)
      for (const name of n.out) {
        const m = byName.get(name);
        if (m && m.depth === null) { m.depth = d; next.push(m); }
      }
    frontier = next;
  }
  // anything the walk never reached: place it past its deepest input
  for (const n of nodes) {
    if (n.depth !== null) continue;
    const ins = n.inp.map(x => byName.get(x)).filter(x => x && x.depth !== null);
    n.depth = ins.length ? Math.max(...ins.map(x => x.depth)) + 1 : 0;
  }
  for (const n of nodes) n.gen = n.depth;
  layout();
}

/* Layered left-to-right by generation, then ordered within each layer by the
   average position of the things each element connects to. A few passes of
   that is enough to stop the edges crossing into an unreadable mess. */
function layout() {
  const layers = new Map();
  for (const n of nodes) {
    const g = n.gen ?? 0;
    if (!layers.has(g)) layers.set(g, []);
    layers.get(g).push(n);
  }
  const keys = [...layers.keys()].sort((a, b) => a - b);
  const COL = 190, ROW = 26;

  for (const g of keys)
    layers.get(g).forEach((n, i) => { n.x = g * COL; n.y = i * ROW; });

  const neighbours = new Map(nodes.map(n => [n, []]));
  for (const l of links) { neighbours.get(l.s).push(l.t); neighbours.get(l.t).push(l.s); }

  for (let pass = 0; pass < 8; pass++) {
    const forward = pass % 2 === 0 ? keys : [...keys].reverse();
    for (const g of forward) {
      const layer = layers.get(g);
      for (const n of layer) {
        const ns = neighbours.get(n).filter(m => (m.gen ?? 0) !== g);
        n._key = ns.length ? ns.reduce((s, m) => s + m.y, 0) / ns.length : n.y;
      }
      layer.sort((a, b) => a._key - b._key);
      layer.forEach((n, i) => { n.y = i * ROW; });
    }
  }
  // centre each column so the whole thing reads as a band
  const tallest = Math.max(...keys.map(g => layers.get(g).length));
  for (const g of keys) {
    const layer = layers.get(g);
    const off = (tallest - layer.length) * ROW / 2;
    layer.forEach(n => { n.y += off; });
  }
}

/* ---------- drawing ---------- */

const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
let gRoot, gLinks, gNodes, gLabels;
let view = { x: 0, y: 0, k: 1 };

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function draw() {
  svg.innerHTML = "";
  const defs = el("defs", {});
  for (const [id, col] of [["ah", "var(--line)"], ["ahOn", "var(--sel)"]]) {
    const m = el("marker", {
      id, viewBox: "0 0 10 10", refX: "9", refY: "5",
      markerWidth: "5", markerHeight: "5", orient: "auto-start-reverse"
    });
    m.append(el("path", { d: "M0,1 L9,5 L0,9 z", fill: col }));
    defs.append(m);
  }
  gRoot = el("g", {});
  gRoot.append(defs);
  gLinks = el("g", { "stroke-linecap": "round", fill: "none" });
  gNodes = el("g", {});
  gLabels = el("g", { "font-size": "10", fill: "var(--dim)" });
  gRoot.append(gLinks, gNodes, gLabels);
  svg.append(gRoot);

  for (const l of links) {
    const mx = (l.s.x + l.t.x) / 2;
    /* Elements sit at their shortest depth from the inlet, so a link can run
       right-to-left. Without an arrowhead that reads as flow in the wrong
       direction, which is genuinely misleading. */
    const p = el("path", {
      d: `M${l.s.x},${l.s.y} C${mx},${l.s.y} ${mx},${l.t.y} ${l.t.x},${l.t.y}`,
      stroke: "var(--line)", "stroke-width": 1,
      "marker-end": "url(#ah)"
    });
    l.el = p;
    gLinks.append(p);
  }

  for (const n of nodes) {
    const r = n.kind === "junction" ? 4.5 : 5.5;
    const shape = n.kind === "junction"
      ? el("rect", { x: n.x - r, y: n.y - r, width: r * 2, height: r * 2,
                     transform: `rotate(45 ${n.x} ${n.y})` })
      : el("circle", { cx: n.x, cy: n.y, r });
    shape.setAttribute("fill", COLOUR[n.kind]);
    shape.setAttribute("stroke", "#0b0e12");
    shape.setAttribute("stroke-width", "1");
    shape.style.cursor = "pointer";
    shape.addEventListener("mouseenter", e => onHover(n, e));
    shape.addEventListener("mousemove", e => moveTip(e));
    shape.addEventListener("mouseleave", () => onHover(null));
    shape.addEventListener("click", e => { e.stopPropagation(); select(n); });
    n.el = shape;
    gNodes.append(shape);

    const t = el("text", { x: n.x + 8, y: n.y + 3 });
    t.textContent = n.name;
    n.label = t;
    gLabels.append(t);
  }
  applyView();
  paint();
}

function applyView() {
  gRoot.setAttribute("transform",
    `translate(${view.x},${view.y}) scale(${view.k})`);
  gLabels.style.display = (showLabels && view.k > 0.55) ? "" : "none";
  for (const n of nodes) n.el.setAttribute("stroke-width", 1 / Math.max(view.k, .3));
}

function related(n) {
  const up = new Set(), down = new Set();
  if (!n) return { up, down };
  for (const name of n.inp) if (byName.has(name)) up.add(byName.get(name));
  for (const name of n.out) if (byName.has(name)) down.add(byName.get(name));
  return { up, down };
}

function paint() {
  const focus = selected || hovered;
  const { up, down } = related(focus);
  for (const n of nodes) {
    let fill = COLOUR[n.kind], r = n.kind === "junction" ? 4.5 : 5.5, op = 1;
    if (focus) {
      if (n === focus) { fill = "var(--sel)"; r += 2.5; }
      else if (up.has(n)) { fill = "var(--up)"; r += 1; }
      else if (down.has(n)) { fill = "var(--down)"; r += 1; }
      else op = 0.28;
    }
    if (n.bad && n !== focus) fill = "#e0603c";
    n.el.setAttribute("fill", fill);
    n.el.setAttribute("opacity", op);
    if (n.el.tagName === "circle") n.el.setAttribute("r", r);
    n.label.setAttribute("opacity", focus && op < 1 ? 0.2 : 0.85);
  }
  for (const l of links) {
    const on = focus && (l.s === focus || l.t === focus);
    l.el.setAttribute("stroke", on ? "var(--sel)" : "var(--line)");
    l.el.setAttribute("stroke-width", on ? 2 : 1);
    l.el.setAttribute("marker-end", on ? "url(#ahOn)" : "url(#ah)");
    l.el.setAttribute("opacity", focus ? (on ? 1 : 0.25) : 0.7);
  }
}

/* ---------- hover, selection ---------- */

const tip = document.getElementById("tip");

function fmt(n) {
  const r = n.raw;
  const line = (k, v) => v ? `<div class="row">${k} <span>${v}</span></div>` : "";
  return `<b>${n.name}</b> <span class="pill">${r.BC_type || ""}</span>
    ${line("length", r.length)}
    ${line("in", r.inp_vessels || "—")}
    ${line("out", r.out_vessels || "—")}
    ${line("generation", r.generation)}
    ${line("parent", r.parent)}
    ${line("type", r.vessel_type)}`;
}

function onHover(n, e) {
  hovered = n;
  if (n) { tip.innerHTML = fmt(n); tip.style.display = "block"; if (e) moveTip(e); }
  else tip.style.display = "none";
  paint();
}

function moveTip(e) {
  const pad = 14, r = tip.getBoundingClientRect(), s = svg.getBoundingClientRect();
  let x = e.clientX - s.left + pad, y = e.clientY - s.top + pad;
  if (x + r.width > s.width) x = e.clientX - s.left - r.width - pad;
  if (y + r.height > s.height) y = e.clientY - s.top - r.height - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}

function select(n) {
  selected = n;
  const d = document.getElementById("detail");
  if (!n) { d.innerHTML = '<span style="color:var(--dim)">nothing selected</span>'; paint(); return; }
  const r = n.raw;
  const row = (k, v) => `<tr><td>${k}</td><td>${v || "—"}</td></tr>`;
  d.innerHTML = `<table class="kv">
    ${row("name", "<b>" + n.name + "</b>")}
    ${row("BC_type", r.BC_type)}
    ${row("type", r.vessel_type)}
    ${row("length", r.length)}
    ${row("in", r.inp_vessels)}
    ${row("out", r.out_vessels)}
    ${row("generation", r.generation)}
    ${row("parent", r.parent)}
    ${row("geometry", r.graph_vessel_id || r.source_ids)}</table>`;
  paint();
}

svg.addEventListener("click", () => select(null));

/* ---------- zoom and pan ---------- */

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const s = svg.getBoundingClientRect();
  const mx = e.clientX - s.left, my = e.clientY - s.top;
  const f = Math.exp(-e.deltaY * 0.0015);
  const k = Math.min(6, Math.max(0.04, view.k * f));
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
  applyView();
}, { passive: false });

let drag = null;
svg.addEventListener("mousedown", e => {
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  svg.classList.add("dragging");
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  view.x = drag.vx + (e.clientX - drag.x);
  view.y = drag.vy + (e.clientY - drag.y);
  applyView();
});
window.addEventListener("mouseup", () => { drag = null; svg.classList.remove("dragging"); });

function fit() {
  if (!nodes.length) return;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const s = svg.getBoundingClientRect(), pad = 50;
  const k = Math.min((s.width - pad * 2) / Math.max(x1 - x0, 1),
                     (s.height - pad * 2) / Math.max(y1 - y0, 1));
  view.k = Math.min(2, Math.max(0.04, k));
  view.x = s.width / 2 - ((x0 + x1) / 2) * view.k;
  view.y = s.height / 2 - ((y0 + y1) / 2) * view.k;
  applyView();
}

function focusOn(n) {
  const s = svg.getBoundingClientRect();
  view.k = Math.max(view.k, 1.1);
  view.x = s.width / 2 - n.x * view.k;
  view.y = s.height / 2 - n.y * view.k;
  applyView();
  select(n);
}

/* ---------- wiring ---------- */

document.getElementById("fit").onclick = fit;
document.getElementById("clear").onclick = () => select(null);
document.getElementById("toggleLabels").onclick = () => {
  showLabels = !showLabels; applyView();
};
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const hit = nodes.find(n => n.name.toLowerCase() === q)
           || nodes.find(n => n.name.toLowerCase().startsWith(q));
  if (hit) focusOn(hit);
});

function loadText(text) {
  const rows = parseCSV(text);
  if (!rows.length || !("name" in rows[0])) {
    document.getElementById("count").textContent =
      "that file has no 'name' column — is it a vessel array CSV?";
    return;
  }
  build(rows);
  draw();
  fit();
  document.getElementById("controls").classList.remove("hidden");
  const k = c => nodes.filter(n => n.kind === c).length;
  const badJ = nodes.filter(n => n.kind === "junction" &&
    (n.inp.length > 2 || n.out.length > 2 || n.out.length === 0 || n.inp.length === 0));
  document.getElementById("count").innerHTML =
    `${nodes.length} elements · ${k("vessel")} vessels · ${k("pericyte")} pericytes ·
     ${k("junction")} junctions · ${links.length} connections` +
    (badJ.length ? `<br><span style="color:#e0603c">${badJ.length} junction(s) with
      an impossible port count: ${badJ.slice(0, 4).map(n => n.name).join(", ")}
      ${badJ.length > 4 ? "…" : ""}</span>` : "");
  for (const n of badJ) n.bad = true;
}

const drop = document.getElementById("drop"), fileInput = document.getElementById("file");
drop.onclick = () => fileInput.click();
fileInput.onchange = e => {
  const f = e.target.files[0];
  if (f) f.text().then(loadText);
};
["dragenter", "dragover"].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0];
  if (f) f.text().then(loadText);
});
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) f.text().then(loadText);
});
window.addEventListener("resize", () => { if (nodes.length) applyView(); });
</script>
</body>
</html>
